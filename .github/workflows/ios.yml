name: iOS

# Build iOS su runner macOS (Xcode non esiste su Linux).
# Produce una .ipa NON firmata come artifact: per installarla su un
# dispositivo serve firmarla (TestFlight con account Apple Developer,
# oppure sideload con AltStore/Sideloadly). Vedi README.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios.yml'
      - 'scripts/build_ios_unsigned.sh'

# Permessi minimi del GITHUB_TOKEN (SECURITY_AUDIT NIP-20); le action di
# terze parti sono fissate per SHA (aggiornate da Dependabot).
permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Build unsigned IPA
        run: ./scripts/build_ios_unsigned.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nipay-ios-unsigned
          path: nipay-unsigned.ipa
          retention-days: 30
