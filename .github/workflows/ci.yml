name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permessi minimi del GITHUB_TOKEN (SECURITY_AUDIT NIP-20); le action di
# terze parti sono fissate per SHA (aggiornate da Dependabot).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      # Ogni stringa deve esistere in tutte le lingue (vedi l10n.yaml):
      # gen-l10n scrive "{}" quando non manca niente.
      - name: Check translations
        run: |
          report=build/untranslated_messages.json
          if [ ! -f "$report" ]; then
            echo "::error::$report non generato: controlla l10n.yaml"
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < "$report")" != "{}" ]; then
            echo "::error::Stringhe non tradotte (lingua → chiavi):"
            cat "$report"
            exit 1
          fi
          echo "Tutte le lingue sono complete."

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
