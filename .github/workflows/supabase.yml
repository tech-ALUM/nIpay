name: Supabase RLS

# Test di isolamento RLS/Storage (supabase/tests/) su un Postgres Supabase
# locale in Docker: mai contro il progetto reale. Gira su qualunque
# branch quando cambiano migration o test, così una policy sbagliata
# viene fermata prima di arrivare in produzione.
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'

# Permessi minimi del GITHUB_TOKEN (SECURITY_AUDIT NIP-20); le action di
# terze parti sono fissate per SHA (aggiornate da Dependabot).
permissions:
  contents: read

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0

      - name: Start local database (applica le migration)
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db
